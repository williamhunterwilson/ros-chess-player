chess_robot_arm:
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  
  links:
    - robot_base
    - shoulder_link
    - upper_arm_link
    - forearm_link
    - wrist_1_link
    - wrist_2_link
    - wrist_3_link
    - ee_link

# Planning parameters
planning_frame: world
end_effector_name: ee_link

# Joint limits (from URDF)
joint_limits:
  shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
    
  shoulder_lift_joint:
    has_velocity_limits: true  
    max_velocity: 1.0
    has_acceleration_limits: false
    
  elbow_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
    
  wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: false
    
  wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: false
    
  wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: false 